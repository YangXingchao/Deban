name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'native/**'
      - 'src-tauri/**'
      - 'scripts/build-*.ps1'
      - 'scripts/build-*.sh'
      - 'ui/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.6
      - name: Test Python
        run: |
          uv sync --frozen
          uv run --frozen python -m unittest discover -s tests -v
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: deban-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build macOS app
        run: ./scripts/build-macos.sh
      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Deban.app dist/Deban-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deban-macos-app
          path: dist/Deban-macos.zip
          if-no-files-found: error
