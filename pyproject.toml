[project]
name = "deban"
version = "0.9.1"
description = "Local meeting transcription and optional AI assistance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "python-multipart>=0.0.32",
    "numpy>=2.5",
    "faster-whisper>=1.2",
    "speechbrain>=1.1",
    "silero-vad>=6.2",
    "torch>=2.13",
    "torchaudio>=2.11",
    "httpx>=0.28",
    "pypdf>=6.16",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "markdown>=3.10",
    "pyyaml>=6.0",
    "nh3>=0.3.7",
    "soundcard>=0.4 ; sys_platform == 'win32'",
]

[tool.uv]
package = false
